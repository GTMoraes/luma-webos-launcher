name: Android

# Luma for Android TV (Chromecast with Google TV). The signed .apk is this
# run's artifact; android/README.md explains the key and how to install it.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'android/**'
      - 'assets/**'
      - 'tools/**'
      - 'vector-geometry/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'appinfo.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Build the Android TV apk
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: armv7-linux-androideabi
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: android
      - name: Install asset tools
        run: |
          apt_options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y --no-install-recommends woff2 python3-fonttools
      - name: Generate native assets
        run: pnpm assets
      - name: Install the Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "LUMA_NDK_VERSION=$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Build SDL2, libluma.so and the asset bundle
        run: bash android/build-native.sh
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'
      - name: Signing key
        env:
          MYS_KEYSTORE_B64: ${{ secrets.MYS_KEYSTORE_B64 }}
        run: |
          if [ -n "$MYS_KEYSTORE_B64" ]; then
            printf '%s' "$MYS_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "MYS_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release key"
          else
            echo "::warning::No MYS_KEYSTORE_B64 secret: the apk is signed with a debug key that changes every run (it will not install over the last one)."
          fi
      - name: Build the apk
        working-directory: android
        env:
          MYS_KEYSTORE_PASS: ${{ secrets.MYS_KEYSTORE_PASS }}
          MYS_KEY_ALIAS: ${{ secrets.MYS_KEY_ALIAS }}
          MYS_KEY_PASS: ${{ secrets.MYS_KEY_PASS }}
        run: gradle --no-daemon assembleRelease
      - name: Name the apk
        run: |
          version=$(sed -n 's/.*"version": *"\([0-9.]*\)".*/\1/p' appinfo.json)
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/luma-android-$version-$GITHUB_RUN_NUMBER.apk"
          cd dist && sha256sum ./*.apk > sha256sums && cat sha256sums && ls -l
      - uses: actions/upload-artifact@v7
        with:
          name: luma-android-${{ github.run_number }}
          if-no-files-found: error
          path: |
            dist/*.apk
            dist/sha256sums
